name: Course quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: course-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Linux course checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/work/terraform-plugin-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-site.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/work/terraform-plugin-cache
          key: terraform-plugins-${{ runner.os }}-azurerm-4.77.0
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.63.1
      - name: Install locked dependencies and browser
        run: |
          python -m pip install -r requirements-site.txt
          npm ci
          npx playwright install --with-deps chromium
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform -chdir=labs/TFA-003 init -backend=false -input=false -lockfile=readonly
      - name: Install reviewed actionlint binary
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --silent --show-error https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint/actionlint.tar.gz"
          curl --fail --location --silent --show-error https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt -o "$RUNNER_TEMP/actionlint/checksums.txt"
          mv "$RUNNER_TEMP/actionlint/actionlint.tar.gz" "$RUNNER_TEMP/actionlint/actionlint_1.7.12_linux_amd64.tar.gz"
          (cd "$RUNNER_TEMP/actionlint" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$RUNNER_TEMP/actionlint/actionlint_1.7.12_linux_amd64.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Full credential-free course validation
        shell: pwsh
        run: ./scripts/Test-Course.ps1 -Jobs 2
      - name: Publish the already validated site build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: learning-site
          path: site
          retention-days: 7
          if-no-files-found: error
  windows:
    name: Windows behavior checks
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - run: python -m pip install -r requirements-site.txt
      - name: Native quoting, local state, fixture adapters and source regressions
        shell: pwsh
        run: ./scripts/Test-Course.ps1 -WindowsOnly