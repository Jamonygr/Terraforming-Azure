<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Terraforming Azure course cover</title><desc id="desc">A classic hub connects three spokes; an isolated simulated on-premises network connects by VPN.</desc>
