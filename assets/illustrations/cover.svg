<rect width="100%" height="100%" rx="24" fill="url(#bg)"/><rect width="100%" height="100%" rx="24" fill="url(#grid)"/>
<text x="54" y="63" fill="#9e8cff" font-family="Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="3">TERRAFORMING AZURE / LEARN BY BUILDING</text>
<text x="54" y="125" fill="#f5f7ff" font-family="Segoe UI,Arial" font-size="46" font-weight="700">Terraforming Azure</text><text x="54" y="166" fill="#a9b5d6" font-family="Segoe UI,Arial" font-size="22">From your first deployment to a complete hub-and-spoke network.</text><path d="M640 285L365 465" stroke="#758bcb" stroke-width="3" fill="none" stroke-dasharray="8 8"/><path d="M640 285L660 495" stroke="#758bcb" stroke-width="3" fill="none" stroke-dasharray="8 8"/><path d="M640 285L955 465" stroke="#758bcb" stroke-width="3" fill="none" stroke-dasharray="8 8"/><path d="M640 285L980 225" stroke="#758bcb" stroke-width="3" fill="none" stroke-dasharray="8 8"/><rect x="540" y="225" width="235" height="96" rx="14" fill="#17213c" stroke="#9e8cff" stroke-width="2"/><text x="558" y="260" fill="#eaf0ff" font-family="Segoe UI,Arial" font-size="18" font-weight="700">HUB</text><text x="558" y="291" fill="#a7c3d7" font-family="Segoe UI,Arial" font-size="15">Firewall · DNS · VPN</text><rect x="255" y="420" width="235" height="96" rx="14" fill="#17213c" stroke="#458aad" stroke-width="2"/><text x="273" y="455" fill="#eaf0ff" font-family="Segoe UI,Arial" font-size="18" font-weight="700">APPLICATIONS</text><text x="273" y="486" fill="#a7c3d7" font-family="Segoe UI,Arial" font-size="15">WAF → private IIS</text><rect x="550" y="450" width="235" height="96" rx="14" fill="#17213c" stroke="#458aad" stroke-width="2"/><text x="568" y="485" fill="#eaf0ff" font-family="Segoe UI,Arial" font-size="18" font-weight="700">DATA</text><text x="568" y="516" fill="#a7c3d7" font-family="Segoe UI,Arial" font-size="15">Private endpoints</text><rect x="845" y="420" width="235" height="96" rx="14" fill="#17213c" stroke="#458aad" stroke-width="2"/><text x="863" y="455" fill="#eaf0ff" font-family="Segoe UI,Arial" font-size="18" font-weight="700">OPERATIONS</text><text x="863" y="486" fill="#a7c3d7" font-family="Segoe UI,Arial" font-size="15">Private verification</text><rect x="870" y="180" width="235" height="96" rx="14" fill="#17213c" stroke="#458aad" stroke-width="2"/><text x="888" y="215" fill="#eaf0ff" font-family="Segoe UI,Arial" font-size="18" font-weight="700">SIMULATED ON-PREM</text><text x="888" y="246" fill="#a7c3d7" font-family="Segoe UI,Arial" font-size="15">IPsec · corporate DNS</text><text x="54" y="572" fill="#9caace" font-family="Segoe UI,Arial" font-size="18">40 LABS     /     6 PHASES     /     POWERSHELL FIRST     /     BUILD · PROVE · REPAIR</text></svg>
