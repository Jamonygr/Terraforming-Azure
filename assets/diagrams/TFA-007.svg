<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">TFA-007 | IP addressing, CIDR, VNets, and subnets</title>
<desc id="desc">A VNet prefix contains subnet prefixes; subnets in the same VNet cannot overlap. Azure reserves the first four and last address in each subnet. A /24 contains 256 addresses but 251 usable addresses, and the gateway address cannot be assigned to a VM. The segmented subnets fit the VNet without overlap.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#55caff"/></marker></defs>
