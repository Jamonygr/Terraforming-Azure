<rect x="38" y="130" width="270" height="145" rx="14" fill="#132d47" stroke="#52658c"/>
<text x="54" y="163" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#72d3ff">10.7.0.0/16</text>
<text x="54" y="218" font-family="Arial,sans-serif" font-size="16" fill="#f4f8ff">VNet address space</text>
<line x1="616" y1="200" x2="646" y2="200" stroke="#55caff" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="346" y="130" width="270" height="145" rx="14" fill="#132d47" stroke="#52658c"/>
<text x="362" y="163" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#72d3ff">Contained /24 subnets</text>
<text x="362" y="218" font-family="Arial,sans-serif" font-size="16" fill="#f4f8ff">disjoint segments</text>
<line x1="924" y1="200" x2="954" y2="200" stroke="#55caff" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="654" y="130" width="270" height="145" rx="14" fill="#132d47" stroke="#52658c"/>
<text x="670" y="163" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#72d3ff">256 total addresses</text>
<text x="670" y="218" font-family="Arial,sans-serif" font-size="16" fill="#f4f8ff">five reserved by Azure</text>
<rect x="962" y="130" width="270" height="145" rx="14" fill="#132d47" stroke="#52658c"/>
<text x="978" y="163" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#72d3ff">251 usable</text>
<text x="978" y="218" font-family="Arial,sans-serif" font-size="16" fill="#f4f8ff">plan capacity before hosts</text>
<text x="38" y="322" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#bca4ff">Evidence to distinguish</text>
<text x="38" y="352" font-family="Arial,sans-serif" font-size="17" fill="#e1e9f4">The segmented subnets fit the VNet without overlap.</text>
<text x="38" y="426" font-family="Arial,sans-serif" font-size="15" fill="#a4b5cc">Terraforming Azure • Original lesson diagram • Azure runtime evidence must be collected separately</text></svg>
