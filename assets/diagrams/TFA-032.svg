<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">TFA-032 | RBAC, policy, budgets, and locks</title>
<desc id="desc">RBAC assigns actions to principals at a scope; Azure Policy evaluates resource properties against governance rules. A deletion lock blocks accidental removal but is not a backup or a defense against an authorized lock remover. A budget alert reports a threshold and does not suspend billable resources. Each control addresses a distinct question and cleanup removes the lock deliberately.</desc>
