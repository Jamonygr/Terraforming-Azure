<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">TFA-039 | Capstone architecture workshop</title>
<desc id="desc">The capstone plan must connect addressing, traffic policy, DNS ownership and costs before resources are created. A traffic row needs both forward and return routes and an enforcement point. Local readiness can check structure and tools, while actual quota, permissions and service support require deliberately collected Azure evidence later. All design decisions have named evidence or explicit unverified status before a live learner deployment.</desc>
