<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">TFA-030 | Simulated on-premises connectivity</title>
<desc id="desc">Two Azure VPN gateways can form a repeatable VNet-to-VNet IPsec exercise. Both reciprocal connections must refer to the other gateway and share the intended key. Connected control-plane status is necessary, but a guest traffic probe and a return route are still required to prove the tunnel is useful. Both connections report Connected and the intended private traffic succeeds.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#55caff"/></marker></defs>
<rect width="1280" height="460" rx="24" fill="#091625"/>
<text x="38" y="52" font-family="Arial,sans-serif" font-size="23" fill="#f4f8ff">TFA-030 | Simulated on-premises connectivity</text>
<text x="38" y="85" font-family="Arial,sans-serif" font-size="17" fill="#bca4ff">Read the dependency, packet path or decision from left to right.</text>
<line x1="308" y1="200" x2="338" y2="200" stroke="#55caff" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="38" y="130" width="270" height="145" rx="14" fill="#132d47" stroke="#52658c"/>
<text x="54" y="163" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#72d3ff">Azure site gateway</text>
<text x="54" y="218" font-family="Arial,sans-serif" font-size="16" fill="#f4f8ff">local address space</text>
<line x1="616" y1="200" x2="646" y2="200" stroke="#55caff" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="346" y="130" width="270" height="145" rx="14" fill="#132d47" stroke="#52658c"/>
<text x="362" y="163" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#72d3ff">Connection A to B</text>
<text x="362" y="218" font-family="Arial,sans-serif" font-size="16" fill="#f4f8ff">shared IPsec key</text>
<line x1="924" y1="200" x2="954" y2="200" stroke="#55caff" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="654" y="130" width="270" height="145" rx="14" fill="#132d47" stroke="#52658c"/>
<text x="670" y="163" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#72d3ff">Connection B to A</text>
<text x="670" y="218" font-family="Arial,sans-serif" font-size="16" fill="#f4f8ff">reciprocal reference</text>
<rect x="962" y="130" width="270" height="145" rx="14" fill="#132d47" stroke="#52658c"/>
<text x="978" y="163" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#72d3ff">Remote site</text>
<text x="978" y="218" font-family="Arial,sans-serif" font-size="16" fill="#f4f8ff">guest path plus return route</text>
<text x="38" y="322" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#bca4ff">Evidence to distinguish</text>
<text x="38" y="352" font-family="Arial,sans-serif" font-size="17" fill="#e1e9f4">Both connections report Connected and the intended private traffic succeeds.</text>
<text x="38" y="426" font-family="Arial,sans-serif" font-size="15" fill="#a4b5cc">Terraforming Azure • Original lesson diagram • Azure runtime evidence must be collected separately</text></svg>
