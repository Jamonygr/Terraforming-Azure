<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">TFA-027 | Application Gateway WAF and private IIS</title>
<desc id="desc">Application Gateway terminates client TLS and creates a separate backend connection. Backend probe success depends on the chosen protocol, port, host header and path. A deterministic custom WAF test should match one training header without depending on evolving managed-rule behavior. Expected IIS content is reachable while the deliberate WAF signature is blocked.</desc>
