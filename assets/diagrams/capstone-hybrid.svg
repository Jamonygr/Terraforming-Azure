<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid capstone: two Azure VPN gateways and an isolated simulated remote site</title>
  <desc id="desc">An Azure-hosted 192.168 remote network has a private Windows DNS/client, its own Azure VPN gateway, and a separate NAT bootstrap path. It has no VNet peering to the hub or spokes. Two Vnet2Vnet connection resources join the remote and hub VPN gateways with IPsec. Hub GatewaySubnet uses only specific spoke destination routes to Firewall. Firewall routes approved private traffic to directly peered application, data, and operations networks. Reciprocal workload routes send remote prefixes back through Firewall and the hub VPN gateway. Resolver DNS reaches corporate DNS over the VPN, independently of application authorization.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090f22"/><stop offset="1" stop-color="#111d37"/></linearGradient>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#b08cff"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#42b5ff"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#5ce0bd"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#eaf2ff}.title{font-size:28px;font-weight:700;letter-spacing:-.5px}.sub{font-size:15px;fill:#acbfd9}.section{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#aebed8}.label{font-size:13px;font-weight:600}.card{fill:#172946;stroke:#3c638e;stroke-width:1.3}.purple{fill:none;stroke:#b08cff;stroke-width:3;marker-start:url(#purple);marker-end:url(#purple)}.blue{fill:none;stroke:#42b5ff;stroke-width:3;marker-start:url(#blue);marker-end:url(#blue)}.green{fill:none;stroke:#5ce0bd;stroke-width:3;marker-end:url(#green)}
    </style>
  </defs>
  <rect width="1200" height="820" rx="20" fill="url(#bg)"/>
  <text x="32" y="44" class="title">A real IPsec path between two simulated sites</text>
  <text x="33" y="72" class="sub">The remote site is an isolated Azure VNet · two Azure VPN gateways · no hub/remote peering · all client NICs private</text>

  <rect x="30" y="112" width="349" height="507" rx="17" fill="#182333" stroke="#8e7aa0" stroke-dasharray="6 4" stroke-width="1.5"/>
  <text x="51" y="146" class="section">Simulated on-premises</text><text x="51" y="171" class="sub">192.168.0.0/16 · Azure-hosted</text>
  <rect x="65" y="206" width="290" height="93" rx="11" class="card"/>
  <text x="85" y="233" class="body" font-weight="700">corp01 · Windows DNS / client</text>
  <text x="85" y="257" class="body">192.168.1.4</text><text x="85" y="280" class="small">snet-corp · 192.168.1.0/24</text>
  <rect x="65" y="355" width="290" height="104" rx="11" class="card"/>
  <text x="85" y="382" class="body" font-weight="700">Remote VPN gateway</text>
  <text x="85" y="406" class="body">VpnGw1AZ · route-based</text>
  <text x="85" y="429" class="small">GatewaySubnet 192.168.255.224/27</text>
  <text x="85" y="449" class="small">Dedicated Standard public IP</text>
  <path d="M210 299V355" class="blue"/><text x="226" y="331" class="label">Private Azure destinations</text>
  <rect x="65" y="514" width="290" height="77" rx="11" fill="#17313a" stroke="#3f8e88"/>
  <text x="85" y="542" class="body" font-weight="700">Explicit NAT Gateway + public IP</text>
  <text x="85" y="566" class="small">Extensions / Azure Monitor bootstrap</text>
  <path d="M65 252H46V552H65" class="green"/>
  <text x="54" y="482" class="small" transform="rotate(-90 54 482)">Separate public egress branch</text>
  <rect x="65" y="660" width="290" height="70" rx="11" class="card"/>
  <text x="85" y="688" class="body" font-weight="700">Public platform endpoints</text><text x="85" y="712" class="small">NAT does not replace private VPN routes</text>
  <path d="M210 591V660" class="green"/><text x="225" y="645" class="label" fill="#5ce0bd">Public egress only</text>

  <rect x="455" y="112" width="349" height="507" rx="17" fill="#171e3a" stroke="#8466bb" stroke-width="1.5"/>
  <text x="476" y="146" class="section">Azure hub</text><text x="476" y="171" class="sub">10.0.0.0/16</text>
  <rect x="479" y="206" width="301" height="93" rx="11" fill="#292346" stroke="#9472ce"/>
  <text x="499" y="233" class="body" font-weight="700">Azure Firewall Standard</text>
  <text x="499" y="257" class="body">Approved ports / FQDNs</text>
  <text x="499" y="280" class="small">Return path retains gateway reachability</text>
  <rect x="479" y="355" width="301" height="104" rx="11" class="card"/>
  <text x="499" y="382" class="body" font-weight="700">Hub VPN gateway</text>
  <text x="499" y="406" class="body">VpnGw1AZ · route-based</text>
  <text x="499" y="429" class="small">GatewaySubnet 10.0.0.128/27</text>
  <text x="499" y="449" class="small">Dedicated Standard public IP</text>
  <path d="M629 355V299" class="blue"/><text x="645" y="321" class="label">Spoke-prefix UDRs</text><text x="645" y="340" class="small">10.10 / 10.20 / 10.30 /16</text>
  <rect x="479" y="514" width="301" height="77" rx="11" class="card"/>
  <text x="499" y="542" class="body" font-weight="700">Resolver inbound / outbound</text>
  <text x="499" y="566" class="small">Azure ↔ corporate DNS over VPN</text>
  <path d="M355 406H479" class="purple"/>
  <rect x="384" y="375" width="66" height="22" rx="5" fill="#0c172c"/><text x="417" y="391" text-anchor="middle" class="label" fill="#c7afff">IPsec</text>
  <text x="416" y="481" text-anchor="middle" class="small">VNet2VNet</text><text x="416" y="500" text-anchor="middle" class="small">two connections</text>

  <rect x="886" y="112" width="284" height="507" rx="17" fill="#111f37" stroke="#355d8a" stroke-width="1.5"/>
  <text x="906" y="146" class="section">Directly peered spokes</text><text x="906" y="171" class="small">Hub gateway transit in hybrid stage</text>
  <rect x="906" y="206" width="244" height="93" rx="11" class="card"/>
  <text x="926" y="233" class="body" font-weight="700">Applications · 10.10.0.0/16</text><text x="926" y="258" class="small">corp01 → IIS HTTP/80</text><text x="926" y="280" class="small">Firewall network rule + NSG</text>
  <rect x="906" y="355" width="244" height="104" rx="11" class="card"/>
  <text x="926" y="382" class="body" font-weight="700">Data · 10.20.0.0/16</text><text x="926" y="407" class="small">Blob / Vault HTTPS/443</text><text x="926" y="430" class="small">Selected PE routes + app-rule SNAT</text><text x="926" y="450" class="small">Private DNS + identity RBAC</text>
  <rect x="906" y="514" width="244" height="77" rx="11" class="card"/>
  <text x="926" y="542" class="body" font-weight="700">Operations · 10.30.0.0/16</text><text x="926" y="566" class="small">Private verification host / ops01</text>
  <path d="M780 252H906" class="blue"/>
  <path d="M780 270H840V407H906" class="blue"/>
  <path d="M780 286H823V552H906" class="blue"/>
  <text x="906" y="610" class="small">Return UDR: 192.168.0.0/16 → FW</text>

  <rect x="455" y="645" width="715" height="104" rx="12" fill="#192641" stroke="#4c628c"/>
  <text x="476" y="672" class="body" font-weight="700">Preserve symmetry; keep the gateway subnet usable</text>
  <text x="476" y="697" class="small">GatewaySubnet: specific spoke UDRs → Firewall · no default-route UDR · no NSG · propagation retained</text>
  <text x="476" y="720" class="small">Workload subnets: 192.168.0.0/16 → Firewall · gateway propagation disabled on those route tables</text>
  <text x="476" y="739" class="small">Firewall return: learned gateway route → hub VPN → remote VPN → corp01</text>

  <path d="M35 779H78" class="purple"/><text x="91" y="784" class="small">Encrypted intersite path</text>
  <path d="M342 779H385" class="blue"/><text x="398" y="784" class="small">Private forward + return</text>
  <path d="M655 779H698" class="green"/><text x="711" y="784" class="small">Simulation bootstrap egress</text>
  <text x="1170" y="807" text-anchor="end" class="small">Training simulation · validates Azure VPN behavior, not a physical VPN appliance or real WAN conditions</text>
</svg>
