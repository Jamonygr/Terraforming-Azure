<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">TFA-028 | Monitoring and diagnostic evidence</title>
<desc id="desc">The agent sends selected guest events through a DCR to a workspace; platform diagnostic settings collect a different source. A scheduled query rule evaluates recently ingested records on a cadence. A synthetic marker lets the learner distinguish missing collection from a wrong query and from an alert that simply has not evaluated yet. Heartbeat, exact event row and alert lifecycle are separate evidence items.</desc>
