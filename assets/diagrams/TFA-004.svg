<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">TFA-004 | Variables, types, and validation</title>
<desc id="desc">Terraform validates typed inputs before creating resources. TF_VAR environment values can be overridden by an explicit tfvars file, so changing the shell alone may not change the plan. Validation should explain a domain rule, such as an allowed environment, instead of relying on an Azure API error. Invalid inputs fail before resource creation; explicit variable precedence is visible.</desc>
