<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">TFA-015 | Drift, import, and refactoring</title>
<desc id="desc">Drift is a difference observed during refresh; Terraform configuration still determines the intended target. Import binds an existing object to an address but does not invent a well-matched configuration. A moved block preserves an existing binding during a declared address refactor. The intended existing object is bound once and moves address without replacement.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#55caff"/></marker></defs>
<rect width="1280" height="460" rx="24" fill="#091625"/>
<text x="38" y="52" font-family="Arial,sans-serif" font-size="23" fill="#f4f8ff">TFA-015 | Drift, import, and refactoring</text>
<text x="38" y="85" font-family="Arial,sans-serif" font-size="17" fill="#bca4ff">Read the dependency, packet path or decision from left to right.</text>
<line x1="308" y1="200" x2="338" y2="200" stroke="#55caff" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="38" y="130" width="270" height="145" rx="14" fill="#132d47" stroke="#52658c"/>
<text x="54" y="163" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#72d3ff">Existing object</text>
<text x="54" y="218" font-family="Arial,sans-serif" font-size="16" fill="#f4f8ff">outside or changed in portal</text>
<line x1="616" y1="200" x2="646" y2="200" stroke="#55caff" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="346" y="130" width="270" height="145" rx="14" fill="#132d47" stroke="#52658c"/>
<text x="362" y="163" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#72d3ff">Import / refresh</text>
<text x="362" y="218" font-family="Arial,sans-serif" font-size="16" fill="#f4f8ff">observe and bind</text>
<line x1="924" y1="200" x2="954" y2="200" stroke="#55caff" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="654" y="130" width="270" height="145" rx="14" fill="#132d47" stroke="#52658c"/>
<text x="670" y="163" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#72d3ff">moved block</text>
<text x="670" y="218" font-family="Arial,sans-serif" font-size="16" fill="#f4f8ff">old address to new</text>
<rect x="962" y="130" width="270" height="145" rx="14" fill="#132d47" stroke="#52658c"/>
<text x="978" y="163" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#72d3ff">Review plan</text>
<text x="978" y="218" font-family="Arial,sans-serif" font-size="16" fill="#f4f8ff">no accidental replacement</text>
<text x="38" y="322" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#bca4ff">Evidence to distinguish</text>
<text x="38" y="352" font-family="Arial,sans-serif" font-size="17" fill="#e1e9f4">The intended existing object is bound once and moves address without replacement.</text>
<text x="38" y="426" font-family="Arial,sans-serif" font-size="15" fill="#a4b5cc">Terraforming Azure • Original lesson diagram • Azure runtime evidence must be collected separately</text></svg>
