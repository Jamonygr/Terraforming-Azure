<text x="54" y="218" font-family="Arial,sans-serif" font-size="16" fill="#f4f8ff">saved binary and metadata</text>
<line x1="616" y1="200" x2="646" y2="200" stroke="#55caff" stroke-width="3" marker-end="url(#arrow)"/>
