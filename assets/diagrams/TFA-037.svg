<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">TFA-037 | Reviewed plan, apply, and destroy workflows</title>
<desc id="desc">A saved plan is the artifact reviewed for a particular operation and state snapshot. Replanning at apply time can invalidate that review. The local rehearsal binds root, operation, source hashes, plan hash and age, while a protected real workflow adds authentication, backend locking and controlled artifact access. The exact reviewed artifact applies; tampered and wrong-operation artifacts fail before Terraform apply.</desc>
