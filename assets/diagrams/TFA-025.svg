<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">TFA-025 | Azure Firewall and Firewall Policy</title>
<desc id="desc">Firewall network rules match IP/port/protocol and application rules understand supported application names. DNS proxy and policy DNS settings influence name-based enforcement. A default deny is meaningful only when a packet actually traverses the Firewall and logging identifies the selected rule or denial. Allowed and prohibited destinations differ according to policy, not accidental direct routing.</desc>
