<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">TFA-005 | References, locals, data sources, and outputs</title>
<desc id="desc">References express both values and dependencies. A data source reads an object owned elsewhere; it does not transfer that object into this state. locals centralize names and tags without creating resources, and outputs expose selected results without granting access. Derived names agree and the data source is not destroyed by this root.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#55caff"/></marker></defs>
<rect width="1280" height="460" rx="24" fill="#091625"/>
<text x="38" y="52" font-family="Arial,sans-serif" font-size="23" fill="#f4f8ff">TFA-005 | References, locals, data sources, and outputs</text>
<text x="38" y="85" font-family="Arial,sans-serif" font-size="17" fill="#bca4ff">Read the dependency, packet path or decision from left to right.</text>
<line x1="308" y1="200" x2="338" y2="200" stroke="#55caff" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="38" y="130" width="270" height="145" rx="14" fill="#132d47" stroke="#52658c"/>
<text x="54" y="163" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#72d3ff">Data source</text>
<text x="54" y="218" font-family="Arial,sans-serif" font-size="16" fill="#f4f8ff">read existing context</text>
<line x1="616" y1="200" x2="646" y2="200" stroke="#55caff" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="346" y="130" width="270" height="145" rx="14" fill="#132d47" stroke="#52658c"/>
<text x="362" y="163" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#72d3ff">locals</text>
<text x="362" y="218" font-family="Arial,sans-serif" font-size="16" fill="#f4f8ff">derive name and tags</text>
<line x1="924" y1="200" x2="954" y2="200" stroke="#55caff" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="654" y="130" width="270" height="145" rx="14" fill="#132d47" stroke="#52658c"/>
<text x="670" y="163" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#72d3ff">Resource reference</text>
<text x="670" y="218" font-family="Arial,sans-serif" font-size="16" fill="#f4f8ff">implicit dependency</text>
<rect x="962" y="130" width="270" height="145" rx="14" fill="#132d47" stroke="#52658c"/>
<text x="978" y="163" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#72d3ff">Output</text>
<text x="978" y="218" font-family="Arial,sans-serif" font-size="16" fill="#f4f8ff">selected result only</text>
<text x="38" y="322" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#bca4ff">Evidence to distinguish</text>
<text x="38" y="352" font-family="Arial,sans-serif" font-size="17" fill="#e1e9f4">Derived names agree and the data source is not destroyed by this root.</text>
<text x="38" y="426" font-family="Arial,sans-serif" font-size="15" fill="#a4b5cc">Terraforming Azure • Original lesson diagram • Azure runtime evidence must be collected separately</text></svg>
