<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">TFA-020 | Compose a network from structured inputs</title>
<desc id="desc">Structured input maps let the caller name each spoke and its subnets. Transformations should preserve meaningful keys so resource identity remains stable. dynamic blocks generate repeated nested arguments; they do not replace for_each when independently addressed resources are required. Existing keyed spokes remain unchanged while only the new key is added.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#55caff"/></marker></defs>
