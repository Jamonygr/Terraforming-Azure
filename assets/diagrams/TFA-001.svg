<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">TFA-001 | Azure, infrastructure as code, and Terraform</title>
<desc id="desc">Configuration expresses desired state; a provider translates its graph into API operations. State records object bindings and is not a second source of desired configuration. A tenant contains identities, while a subscription owns resource billing and access boundaries. The plan changes the recorded input; no Azure resource is created.</desc>
