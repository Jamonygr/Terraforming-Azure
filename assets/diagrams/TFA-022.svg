<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">TFA-022 | Azure DNS and private DNS</title>
<desc id="desc">A private DNS zone becomes visible through VNet links; creating its record alone is insufficient. The original query name and its eventual private answer are different facts when aliases are involved. A successful lookup is name resolution evidence, not proof that a service port or identity authorization works. The expected private address is returned from the linked resolver context.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#55caff"/></marker></defs>
<rect width="1280" height="460" rx="24" fill="#091625"/>
<text x="38" y="52" font-family="Arial,sans-serif" font-size="23" fill="#f4f8ff">TFA-022 | Azure DNS and private DNS</text>
<text x="38" y="85" font-family="Arial,sans-serif" font-size="17" fill="#bca4ff">Read the dependency, packet path or decision from left to right.</text>
<line x1="308" y1="200" x2="338" y2="200" stroke="#55caff" stroke-width="3" marker-end="url(#arrow)"/>
