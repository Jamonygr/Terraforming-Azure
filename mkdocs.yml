site_name: Terraforming Azure
site_description: A Windows-first journey from Terraform basics to a complete Azure
  hub-and-spoke network.
site_url: https://jamonygr.github.io/Terraforming-Azure/
repo_url: https://github.com/Jamonygr/Terraforming-Azure
repo_name: Jamonygr/Terraforming-Azure
docs_dir: .site-docs
site_dir: site
use_directory_urls: true
theme:
  name: material
  font: false
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - search.highlight
  - content.code.copy
  palette:
  - scheme: slate
    primary: indigo
    accent: cyan
    toggle:
      icon: material/brightness-4
      name: Use light theme
  - scheme: default
    primary: indigo
    accent: deep purple
    toggle:
      icon: material/brightness-7
      name: Use dark theme
nav:
- Start here: index.md
- Learning phases:
  - 1 · Foundations:
    - Phase overview: phases/phase-1.md
    - TFA-001 · Azure, infrastructure as code, and Terraform: labs/TFA-001.md
    - TFA-002 · Prepare your workstation and subscription: labs/TFA-002.md
    - TFA-003 · Your first Azure deployment: labs/TFA-003.md
    - TFA-004 · Variables, types, and validation: labs/TFA-004.md
    - TFA-005 · References, locals, data sources, and outputs: labs/TFA-005.md
    - TFA-006 · Collections and resource identity: labs/TFA-006.md
  - 2 · Azure networks:
    - Phase overview: phases/phase-2.md
    - TFA-007 · IP addressing, CIDR, VNets, and subnets: labs/TFA-007.md
    - TFA-008 · NSGs and application security groups: labs/TFA-008.md
    - TFA-009 · Explicit outbound connectivity: labs/TFA-009.md
    - TFA-010 · Private Windows VM and IIS: labs/TFA-010.md
    - TFA-011 · Private administration with Bastion: labs/TFA-011.md
    - TFA-012 · VNet peering and its limits: labs/TFA-012.md
    - TFA-013 · Routes, next hops, and Network Watcher: labs/TFA-013.md
  - 3 · Terraform engineering:
    - Phase overview: phases/phase-3.md
    - TFA-014 · State, addressing, and locking: labs/TFA-014.md
    - TFA-015 · Drift, import, and refactoring: labs/TFA-015.md
    - TFA-016 · Azure remote-state bootstrap: labs/TFA-016.md
    - TFA-017 · Your first reusable module: labs/TFA-017.md
    - TFA-018 · Module contracts and safe changes: labs/TFA-018.md
    - TFA-019 · Environment and state separation: labs/TFA-019.md
