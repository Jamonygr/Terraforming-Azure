- Practice: practice.md
- Your progress: progress.md
- Run safely:
  - Cost and cleanup: guides/cost-and-cleanup.md
  - Backend bootstrap: guides/backend.md
  - Delivery and OIDC: guides/delivery.md
  - Troubleshooting: guides/troubleshooting.md
  - Glossary: guides/glossary.md
  - Live smoke tests: guides/live-smoke-tests.md
  - Validation status: guides/validation.md
plugins:
- search:
    lang: en
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- toc:
    permalink: true
- pymdownx.details
- pymdownx.highlight
- pymdownx.superfences
extra_css:
- web/course.css
extra_javascript:
- web/course.js
validation:
  links:
    unrecognized_links: warn
    not_found: warn
    anchors: warn
